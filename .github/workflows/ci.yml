# Every push to web, and every PR aimed at it, gets verified. A push also gets a
# throwaway preview URL. Nothing here can touch the production alias; that is
# Release's job, and only a tag starts it.
name: CI

on:
  push:
    branches: [web]
  pull_request:
    branches: [web]

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  verify:
    uses: ./.github/workflows/verify.yml

  preview:
    name: Preview deploy
    needs: verify
    # Only for pushes to web: a pull request from a fork cannot read the token,
    # and the Vercel project should never be reachable from someone else's branch.
    # The variable check keeps the job out of the way until the project is wired up.
    if: github.event_name == 'push' && vars.VERCEL_PROJECT_ID != ''
    runs-on: ubuntu-latest
    env:
      VERCEL_TOKEN: ${{ secrets.VERCEL_TOKEN }}
      VERCEL_ORG_ID: ${{ vars.VERCEL_ORG_ID }}
      VERCEL_PROJECT_ID: ${{ vars.VERCEL_PROJECT_ID }}
    steps:
      - name: Require the Vercel token
        run: |
          if [ -z "$VERCEL_TOKEN" ]; then
            echo "::error::VERCEL_TOKEN is not set. Add it with: gh secret set VERCEL_TOKEN --repo ${{ github.repository }}"
            exit 1
          fi
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version-file: .nvmrc
          cache: npm
      - name: Install npm 11 and the Vercel CLI
        run: npm install -g npm@11 vercel@59
      - name: Pull the preview environment
        run: vercel pull --yes --environment=preview
      - name: Build
        run: vercel build
      - name: Deploy
        id: deploy
        run: echo "url=$(vercel deploy --prebuilt | tail -n 1)" >> "$GITHUB_OUTPUT"
      - name: Report the URL
        run: |
          {
            echo "### Preview"
            echo ""
            echo "${{ steps.deploy.outputs.url }}"
            echo ""
            echo "The public site is untouched. Tag a version to publish."
          } >> "$GITHUB_STEP_SUMMARY"
